name: prompts

# Contributors only edit prompts.json. This checks their PR, and after merge
# regenerates feed.xml, feed.json and PROMPTS.md so nobody has to run the build.
on:
  pull_request:
  push:
    branches: [main]
    paths: [prompts.json, scripts/**, feed-config.json, site/**]

# Read-only by default: PR code (including scripts/build.py) never runs with a
# token that can push. Only the publish job, on main, gets write access.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate prompts.json and build feeds
        run: python3 scripts/build.py

      - name: Tests
        run: python3 -m unittest discover -s tests

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Biome and TypeScript
        run: pnpm check

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Build feeds
        run: python3 scripts/build.py

      - name: Commit regenerated feeds
        run: |
          if git diff --quiet -- feed.xml feed.json PROMPTS.md; then
            echo "Feeds already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml feed.json PROMPTS.md
          git commit -m "Rebuild feeds"
          git push
